<header class="site-header">
  <div class="top-accent-bar"></div>
  <div class="header-container">
    <div class="header-main-row">
      <a routerLink="/" class="brand" aria-label="Brasil Transparente — página inicial">
        <img src="/images/logo.webp" alt="Brasil Transparente" class="header-logo" />
        <span class="brand-divider" aria-hidden="true">|</span>
        <div class="brand-text">
          <span class="brand-context">PORTAL CÍVICO DE DADOS ABERTOS</span>
        </div>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a routerLink="/analises" class="nav-link" routerLinkActive="active">
          <i class="fas fa-chart-pie nav-icon"></i>
          <span>Análises</span>
        </a>
        <a routerLink="/metodologia" class="nav-link" routerLinkActive="active">
          <i class="fas fa-book-open nav-icon"></i>
          <span>Metodologia</span>
        </a>
        <a routerLink="/origem" class="nav-link" routerLinkActive="active">
          <i class="fas fa-database nav-icon"></i>
          <span>Origem</span>
        </a>
        <a routerLink="/sobre" class="nav-link" routerLinkActive="active">
          <i class="fas fa-info-circle nav-icon"></i>
          <span>Sobre</span>
        </a>
      </nav>
    </div>

    @if (router.url === '/' || router.url === '/gastos-detalhados' || router.url === '/calculadora') {
      <div class="report-switcher-wrapper">
        <div class="report-switcher" role="tablist" aria-label="Visualização do relatório">
          <a
            routerLink="/"
            class="report-tab"
            [class.active]="router.url === '/'"
            role="tab"
            [attr.aria-selected]="router.url === '/'"
          >
            <i class="fas fa-layer-group tab-icon"></i>
            <span>Resumo dos Gastos</span>
          </a>
          <a
            routerLink="/gastos-detalhados"
            class="report-tab"
            [class.active]="router.url === '/gastos-detalhados'"
            role="tab"
            [attr.aria-selected]="router.url === '/gastos-detalhados'"
          >
            <i class="fas fa-sitemap tab-icon"></i>
            <span>Gastos Detalhados</span>
          </a>
          <a
            routerLink="/calculadora"
            class="report-tab"
            [class.active]="router.url === '/calculadora'"
            role="tab"
            [attr.aria-selected]="router.url === '/calculadora'"
          >
            <i class="fas fa-calculator tab-icon"></i>
            <span>Calculadora de Contribuição</span>
          </a>
        </div>
      </div>
    }
  </div>
</header>
