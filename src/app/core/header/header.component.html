<header [class.home-hero]="router.url === '/' || router.url === '/gastos-detalhados'">
  <div class="header-content">
    <a routerLink="/" class="brand" aria-label="Brasil Transparente — página inicial">
      <img src="/images/logo.webp" alt="Brasil Transparente" class="header-image" />
      <span class="brand-context">Dados públicos federais, em linguagem acessível</span>
    </a>

    @if (router.url === '/' || router.url === '/gastos-detalhados') {
      <nav class="report-nav" aria-label="Navegação dos relatórios">
        <a
          routerLink="/"
          class="report-button report-button-text-center"
          [class.active]="router.url === '/'"
        >
          Resumo dos Gastos
        </a>
        <a
          routerLink="/gastos-detalhados"
          class="report-button report-button-text-center"
          [class.active]="router.url === '/gastos-detalhados'"
        >
          Gastos Detalhados
        </a>
      </nav>
    }
  </div>
</header>
